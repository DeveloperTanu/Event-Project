<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Wallet — Student Expense Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1625; --ink-2:#584f6b; --ink-3:#8b81a3;
  --bg:#f6f4fb; --bg-2:#ffffff; --line:rgba(26,22,37,.09);
  --grape:#6d3df5; --grape-2:#9b5cff;
  --punch:#ff4d6d; --mango:#ff9f1c; --mint:#00c2a8; --sky:#2e9bff; --lilac:#c56cff;
  --shadow:0 1px 2px rgba(26,22,37,.05), 0 12px 32px -12px rgba(26,22,37,.16);
  --shadow-lg:0 2px 4px rgba(26,22,37,.06), 0 24px 48px -16px rgba(64,30,140,.28);
  --r:20px; --r-sm:14px;
  --glow-1:rgba(155,92,255,.30); --glow-2:rgba(255,77,109,.22); --glow-3:rgba(0,194,168,.22);
}
html.dark{
  --ink:#f3f0fa; --ink-2:#b5acc9; --ink-3:#7f7596;
  --bg:#0e0b17; --bg-2:#181328; --line:rgba(255,255,255,.09);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 16px 40px -16px rgba(0,0,0,.7);
  --shadow-lg:0 2px 6px rgba(0,0,0,.5), 0 28px 56px -18px rgba(0,0,0,.8);
  --glow-1:rgba(155,92,255,.34); --glow-2:rgba(255,77,109,.22); --glow-3:rgba(0,194,168,.20);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg); color:var(--ink); min-height:100vh; overflow-x:hidden;
  transition:background .3s,color .3s;
}
body::before{
  content:''; position:fixed; inset:-20%; z-index:-1; pointer-events:none;
  background:
    radial-gradient(42vw 42vw at 8% 2%, var(--glow-1), transparent 62%),
    radial-gradient(38vw 38vw at 96% 12%, var(--glow-2), transparent 60%),
    radial-gradient(44vw 44vw at 50% 100%, var(--glow-3), transparent 62%);
  filter:blur(18px);
}
h1,h2,h3,.display{font-family:'Bricolage Grotesque',Inter,sans-serif;letter-spacing:-.025em}
.tnum{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--ink-3);opacity:.4;border-radius:9px}
::-webkit-scrollbar-track{background:transparent}
::placeholder{color:var(--ink-3)}
input,select,button,textarea{font-family:inherit;font-size:inherit;color:inherit}
input[type=date]::-webkit-calendar-picker-indicator{opacity:.55;cursor:pointer}
.dark input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.6}
svg{display:block}

@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.rise{animation:rise .35s cubic-bezier(.2,.8,.3,1) both}
.rise>*{animation:rise .4s cubic-bezier(.2,.8,.3,1) both}
.rise>*:nth-child(2){animation-delay:.04s}
.rise>*:nth-child(3){animation-delay:.08s}
.rise>*:nth-child(4){animation-delay:.12s}
.rise>*:nth-child(5){animation-delay:.16s}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
.side{
  display:none; width:252px; flex-shrink:0; flex-direction:column; gap:4px;
  padding:20px 14px; position:sticky; top:0; height:100vh;
  border-right:1px solid var(--line);
  background:linear-gradient(180deg, color-mix(in srgb, var(--bg-2) 72%, transparent), color-mix(in srgb, var(--bg-2) 30%, transparent));
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
}
@media(min-width:900px){.side{display:flex}}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.content{
  flex:1;width:100%;max-width:1180px;margin:0 auto;
  padding:18px 16px calc(104px + env(safe-area-inset-bottom));
}
@media(min-width:640px){.content{padding:26px 24px 40px}}
@media(min-width:900px){.content{padding:32px 34px 40px}}

/* ---------- brand ---------- */
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 20px}
.brand-mark{
  width:38px;height:38px;border-radius:13px;flex-shrink:0;
  display:grid;place-items:center;color:#fff;
  background:linear-gradient(140deg,var(--grape-2),var(--grape) 45%,var(--punch));
  box-shadow:0 8px 20px -6px rgba(109,61,245,.6);
}
.brand-mark svg{width:19px;height:19px}
.brand-name{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:19px;letter-spacing:-.03em}

/* ---------- nav ---------- */
.nav-btn{
  display:flex;align-items:center;gap:12px;width:100%;
  padding:11px 13px;border:0;border-radius:13px;cursor:pointer;
  background:transparent;color:var(--ink-2);font-weight:600;font-size:14.5px;
  transition:background .18s,color .18s,transform .18s;
}
.nav-btn svg{width:19px;height:19px}
.nav-btn:hover{background:color-mix(in srgb,var(--ink) 6%,transparent);color:var(--ink)}
.nav-btn.on{
  color:#fff;
  background:linear-gradient(120deg,var(--grape),var(--grape-2));
  box-shadow:0 10px 22px -10px rgba(109,61,245,.75);
}
.nav-btn.on:hover{transform:translateY(-1px)}

/* ---------- topbar (mobile) ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 16px calc(12px); position:sticky;top:0;z-index:30;
  border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--bg) 80%,transparent);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  padding-top:calc(12px + env(safe-area-inset-top));
}
@media(min-width:900px){.topbar{display:none}}

/* ---------- tabbar (mobile) ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:grid;grid-template-columns:repeat(5,1fr);
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);
  background:color-mix(in srgb,var(--bg-2) 86%,transparent);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
}
@media(min-width:900px){.tabbar{display:none}}
.tab{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  border:0;background:transparent;cursor:pointer;padding:6px 2px;border-radius:12px;
  font-size:10.5px;font-weight:600;color:var(--ink-3);transition:color .18s;
}
.tab svg{width:21px;height:21px}
.tab.on{color:var(--grape)}
html.dark .tab.on{color:var(--grape-2)}
.tab.on .tab-ico{
  background:linear-gradient(130deg,var(--grape),var(--lilac));color:#fff;
  box-shadow:0 8px 18px -8px rgba(109,61,245,.8);
}
.tab-ico{padding:5px 13px;border-radius:12px;transition:background .2s,color .2s}

/* ---------- cards ---------- */
.card{
  border-radius:var(--r);border:1px solid var(--line);
  background:color-mix(in srgb,var(--bg-2) 82%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:var(--shadow);
}
.pad{padding:18px}
@media(min-width:640px){.pad{padding:22px}}

.hero{
  position:relative;overflow:hidden;color:#fff;border:0;
  border-radius:24px;padding:22px;
  background:linear-gradient(135deg,#7c3ff7 0%,#a855f7 42%,#ff4d6d 100%);
  box-shadow:var(--shadow-lg);
}
@media(min-width:640px){.hero{padding:28px}}
.hero::after{
  content:'';position:absolute;right:-70px;top:-90px;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.28),transparent 68%);
}
.hero::before{
  content:'';position:absolute;left:-50px;bottom:-110px;width:230px;height:230px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,193,61,.4),transparent 66%);
}
.hero>*{position:relative;z-index:1}

/* ---------- stats ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:900px){.stat-grid{grid-template-columns:repeat(4,1fr);gap:16px}}
.stat{
  position:relative;overflow:hidden;border-radius:var(--r);padding:16px;
  border:1px solid var(--line);box-shadow:var(--shadow);
  background:color-mix(in srgb,var(--bg-2) 86%,transparent);
  transition:transform .22s,box-shadow .22s;
}
@media(min-width:640px){.stat{padding:19px}}
.stat:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.stat-bar{position:absolute;inset:0 0 auto 0;height:4px}
.stat-lbl{font-size:11.5px;font-weight:600;color:var(--ink-3);letter-spacing:.02em}
.stat-val{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px;letter-spacing:-.035em;margin-top:8px;line-height:1.1}
@media(min-width:640px){.stat-val{font-size:27px}}
.stat-sub{font-size:11px;color:var(--ink-3);margin-top:5px}
.chip-ico{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;flex-shrink:0}
.chip-ico svg{width:16px;height:16px}

/* ---------- misc ---------- */
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.h-title{font-size:23px;font-weight:800;letter-spacing:-.035em}
@media(min-width:640px){.h-title{font-size:28px}}
.h-sub{font-size:13.5px;color:var(--ink-2);margin-top:3px}
.sec-title{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:15px;letter-spacing:-.02em}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 18px;border:0;border-radius:13px;cursor:pointer;
  font-weight:650;font-size:14px;transition:transform .18s,box-shadow .18s,filter .18s;
}
.btn svg{width:16px;height:16px}
.btn:active{transform:scale(.97)}
.btn-grad{
  color:#fff;background:linear-gradient(120deg,var(--grape),var(--lilac) 60%,var(--punch));
  box-shadow:0 10px 24px -10px rgba(109,61,245,.8);
}
.btn-grad:hover{filter:brightness(1.07);transform:translateY(-2px)}
.btn-soft{background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--ink-2)}
.btn-soft:hover{background:color-mix(in srgb,var(--ink) 11%,transparent);color:var(--ink)}
.btn-red{color:#fff;background:linear-gradient(120deg,#ff4d6d,#e11d48);box-shadow:0 10px 24px -10px rgba(225,29,72,.7)}
.icon-btn{
  width:38px;height:38px;border-radius:12px;border:1px solid var(--line);
  background:color-mix(in srgb,var(--bg-2) 70%,transparent);
  display:grid;place-items:center;cursor:pointer;color:var(--ink-2);transition:all .18s;
}
.icon-btn svg{width:17px;height:17px}
.icon-btn:hover{color:var(--ink);transform:translateY(-1px)}
.mini-btn{
  width:30px;height:30px;border-radius:10px;border:0;background:transparent;
  display:grid;place-items:center;cursor:pointer;color:var(--ink-3);transition:all .16s;
}
.mini-btn svg{width:15px;height:15px}
.mini-btn:hover{background:color-mix(in srgb,var(--grape) 14%,transparent);color:var(--grape)}
.mini-btn.danger:hover{background:rgba(255,77,109,.15);color:var(--punch)}

.field{
  width:100%;padding:11px 13px;border-radius:13px;
  border:1px solid var(--line);background:color-mix(in srgb,var(--bg-2) 70%,transparent);
  font-size:14px;outline:none;transition:border-color .18s,box-shadow .18s;
}
.field:focus{border-color:var(--grape);box-shadow:0 0 0 3.5px color-mix(in srgb,var(--grape) 18%,transparent)}
select.field{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
.f-lbl{display:block;font-size:11.5px;font-weight:650;color:var(--ink-3);margin-bottom:6px;letter-spacing:.02em}

.list>*+*{border-top:1px solid var(--line)}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.item-l{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.avatar{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex-shrink:0;font-size:17px}
.item-name{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-meta{font-size:11.5px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-amt{font-weight:750;font-size:15px;white-space:nowrap}
.acts{display:flex;gap:2px;opacity:1}
@media(hover:hover){.acts{opacity:0;transition:opacity .18s}.item:hover .acts{opacity:1}}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:46px 20px;color:var(--ink-3)}
.empty-ico{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;margin-bottom:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--grape) 16%,transparent),color-mix(in srgb,var(--punch) 14%,transparent));color:var(--grape)}
.empty-ico svg{width:24px;height:24px}
.empty-t{font-weight:650;font-size:14.5px;color:var(--ink-2)}
.empty-s{font-size:12.5px;margin-top:5px;max-width:280px}

.alert{display:flex;align-items:flex-start;gap:11px;padding:13px 16px;border-radius:var(--r-sm);font-size:13.5px;font-weight:550;line-height:1.45}
.alert svg{width:17px;height:17px;flex-shrink:0;margin-top:1px}
.alert.over{background:linear-gradient(110deg,rgba(255,77,109,.16),rgba(255,77,109,.07));color:#e11d48;border:1px solid rgba(255,77,109,.3)}
.alert.warn{background:linear-gradient(110deg,rgba(255,159,28,.18),rgba(255,159,28,.07));color:#d97706;border:1px solid rgba(255,159,28,.32)}
html.dark .alert.over{color:#ff8fa3}
html.dark .alert.warn{color:#fcbf59}

.split{display:grid;gap:14px}
@media(min-width:1020px){.split{grid-template-columns:5fr 7fr;gap:16px}}

.legend-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px;padding:5px 0}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.pct{font-size:11px;font-weight:600;color:var(--ink-3);padding:2px 7px;border-radius:7px;background:color-mix(in srgb,var(--ink) 7%,transparent)}

.bcard{border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;background:color-mix(in srgb,var(--bg-2) 86%,transparent);transition:transform .22s,box-shadow .22s}
.bcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.track{height:9px;border-radius:9px;overflow:hidden;background:color-mix(in srgb,var(--ink) 9%,transparent)}
.track>div{height:100%;border-radius:9px;transform-origin:left;animation:grow .55s cubic-bezier(.2,.8,.3,1) both}

.filters{display:flex;flex-wrap:wrap;gap:10px}
.filters>*{flex:1 1 150px;min-width:0}
.search-wrap{position:relative;flex:1 1 100%}
@media(min-width:640px){.search-wrap{flex:2 1 220px}}
.search-wrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-3)}
.search-wrap .field{padding-left:38px}

/* ---------- modal ---------- */
.backdrop{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(14,11,23,.55);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);animation:rise .2s both}
@media(min-width:640px){.backdrop{align-items:center;padding:20px}}
.sheet{
  width:100%;max-width:440px;max-height:92vh;display:flex;flex-direction:column;
  background:var(--bg-2);border:1px solid var(--line);
  border-radius:26px 26px 0 0;box-shadow:var(--shadow-lg);
  animation:pop .3s cubic-bezier(.2,.9,.3,1) both;
  padding-bottom:env(safe-area-inset-bottom);
}
@media(min-width:640px){.sheet{border-radius:24px;padding-bottom:0}}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.sheet-hd h3{font-size:17px;font-weight:700}
.sheet-bd{padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.sheet-ft{display:flex;gap:10px;padding:14px 20px 18px;border-top:1px solid var(--line)}
.sheet-ft .btn{flex:1}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:9px auto -4px}
@media(min-width:640px){.grab{display:none}}
.err{font-size:12.5px;color:var(--punch);font-weight:600;display:none}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);z-index:80;
  bottom:calc(88px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:8px;padding:12px 20px;border-radius:15px;
  color:#fff;font-size:13.5px;font-weight:650;
  background:linear-gradient(120deg,var(--grape),var(--lilac));
  box-shadow:0 16px 36px -12px rgba(109,61,245,.8);
  animation:pop .3s cubic-bezier(.2,.9,.3,1) both;
}
.toast svg{width:16px;height:16px}
@media(min-width:900px){.toast{bottom:28px}}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}
</style>
</head>
<body>
<div id="app" class="shell"></div>

<script>
/* ============================= STATE ============================= */
const CATEGORIES = ['Food','Transport','Education','Shopping','Entertainment','Subscriptions','Health','Other'];
const INCOME_SOURCES = ['Pocket Money','Salary','Scholarship','Other'];
const CAT_COLORS = {
  Food:'#ff9f1c', Transport:'#2e9bff', Education:'#9b5cff', Shopping:'#ff4d6d',
  Entertainment:'#00c2a8', Subscriptions:'#6d3df5', Health:'#f43f5e', Other:'#8b81a3'
};
const CAT_EMOJI = {
  Food:'🍜', Transport:'🚌', Education:'📚', Shopping:'🛍️',
  Entertainment:'🎬', Subscriptions:'🔁', Health:'💊', Other:'✨'
};

const store = {
  get(k,f){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):f; }catch(e){ return f; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};

let state = {
  view:'dashboard',
  theme: store.get('wallet_theme', (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')),
  expenses: store.get('wallet_expenses', []),
  income: store.get('wallet_income', []),
  budgets: store.get('wallet_budgets', []),
  dashPeriod:'month',
  histFilters:{search:'',category:'all',period:'month',start:'',end:''},
  modal:null, toast:null
};

function persist(){
  store.set('wallet_expenses',state.expenses);
  store.set('wallet_income',state.income);
  store.set('wallet_budgets',state.budgets);
  store.set('wallet_theme',state.theme);
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayISO(){ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function fmtMoney(n){ return '₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2}); }
function fmtShort(n){
  n=Number(n||0); const a=Math.abs(n);
  if(a>=1e7) return '₹'+(n/1e7).toFixed(a>=1e8?0:1)+'Cr';
  if(a>=1e5) return '₹'+(n/1e5).toFixed(a>=1e6?0:1)+'L';
  if(a>=1e4) return '₹'+(n/1e3).toFixed(0)+'K';
  return fmtMoney(n);
}
function fmtDate(d){ return new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}); }
function esc(s){ const d=document.createElement('div'); d.innerText = s==null?'':s; return d.innerHTML; }

/* ============================= PERIOD ============================= */
function startOfWeek(d){ const x=new Date(d); const day=x.getDay(); x.setDate(x.getDate()+(day===0?-6:1-day)); x.setHours(0,0,0,0); return x; }
function periodRange(period, custom){
  const now=new Date(); now.setHours(0,0,0,0);
  if(period==='today') return {start:new Date(now),end:new Date(now)};
  if(period==='week'){ const s=startOfWeek(now); const e=new Date(s); e.setDate(e.getDate()+6); return {start:s,end:e}; }
  if(period==='month'){ return {start:new Date(now.getFullYear(),now.getMonth(),1), end:new Date(now.getFullYear(),now.getMonth()+1,0)}; }
  if(period==='custom' && custom && custom.start && custom.end) return {start:new Date(custom.start+'T00:00:00'),end:new Date(custom.end+'T00:00:00')};
  return {start:new Date(2000,0,1),end:new Date(2100,0,1)};
}
function inRange(ds,r){ const d=new Date(ds+'T00:00:00'); return d>=r.start && d<=r.end; }
function expensesIn(r){ return state.expenses.filter(e=>inRange(e.date,r)); }
function incomeIn(r){ return state.income.filter(i=>inRange(i.date,r)); }
function totalOf(a){ return a.reduce((s,x)=>s+Number(x.amount||0),0); }
function categoryBreakdown(arr){
  const m={}; arr.forEach(e=>{ m[e.category]=(m[e.category]||0)+Number(e.amount); });
  return Object.entries(m).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
}
function spendOverTime(range){
  const days=Math.round((range.end-range.start)/86400000)+1;
  const out=[];
  if(days<=31 && days>0){
    for(let i=0;i<days;i++){
      const d=new Date(range.start); d.setDate(d.getDate()+i);
      const iso=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
      out.push({label:d.toLocaleDateString('en-IN',{day:'numeric'}), full:d.toLocaleDateString('en-IN',{day:'numeric',month:'short'}),
        value: state.expenses.filter(e=>e.date===iso).reduce((s,e)=>s+Number(e.amount),0)});
    }
  } else {
    let c=new Date(range.start); let guard=0;
    const first = state.expenses.length ? state.expenses.map(e=>e.date).sort()[0] : null;
    if(range.start.getFullYear()<2005 && first) c=new Date(first+'T00:00:00');
    const stop = range.end>new Date()? new Date(): range.end;
    while(c<=stop && guard++<80){
      const we=new Date(c); we.setDate(we.getDate()+6);
      out.push({label:c.toLocaleDateString('en-IN',{day:'numeric',month:'short'}), full:c.toLocaleDateString('en-IN',{day:'numeric',month:'short'}),
        value: state.expenses.filter(e=>inRange(e.date,{start:c,end:we})).reduce((s,e)=>s+Number(e.amount),0)});
      c=new Date(we); c.setDate(c.getDate()+1);
    }
  }
  return out;
}
function budgetProgress(b){
  const range=periodRange(b.period==='weekly'?'week':'month');
  const spent=totalOf(state.expenses.filter(e=>inRange(e.date,range)&&(b.category==='all'||e.category===b.category)));
  const pct=b.amount>0?Math.min(999,(spent/b.amount)*100):0;
  return {spent,pct,range,status:pct>=100?'over':pct>=80?'warn':'ok'};
}

/* ============================= CHARTS ============================= */
function donut(data,size){
  const total=data.reduce((s,[,v])=>s+v,0);
  if(total<=0) return empty('Nothing tracked yet','Add an expense and your breakdown blooms here.');
  const r=size/2-15, cx=size/2, cy=size/2, circ=2*Math.PI*r;
  let off=0;
  const segs=data.map(([cat,val])=>{
    const len=(val/total)*circ;
    const s=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${CAT_COLORS[cat]}" stroke-width="15"
      stroke-dasharray="${Math.max(len-2,0)} ${circ-Math.max(len-2,0)}" stroke-dashoffset="${-off}" stroke-linecap="round"
      transform="rotate(-90 ${cx} ${cy})"/>`;
    off+=len; return s;
  }).join('');
  return `
  <div style="display:flex;flex-direction:column;align-items:center;gap:20px">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex-shrink:0">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--line)" stroke-width="15"/>
      ${segs}
      <text x="${cx}" y="${cy-1}" text-anchor="middle" fill="var(--ink)" style="font-family:'Bricolage Grotesque',sans-serif;font-size:19px;font-weight:800;letter-spacing:-.03em">${fmtShort(total)}</text>
      <text x="${cx}" y="${cy+17}" text-anchor="middle" fill="var(--ink-3)" style="font-size:10.5px;font-weight:600">total spent</text>
    </svg>
    <div style="width:100%">
      ${data.map(([cat,val])=>`
        <div class="legend-row">
          <span style="display:flex;align-items:center;gap:9px;min-width:0"><span class="dot" style="background:${CAT_COLORS[cat]}"></span><span style="color:var(--ink-2);font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${cat}</span></span>
          <span style="display:flex;align-items:center;gap:9px;flex-shrink:0">
            <span class="pct">${((val/total)*100).toFixed(0)}%</span>
            <span class="tnum" style="font-weight:700">${fmtMoney(val)}</span>
          </span>
        </div>`).join('')}
    </div>
  </div>`;
}

function bars(buckets){
  if(!buckets.length) return empty('No activity','Nothing to plot for this range yet.');
  const H=170, max=Math.max(1,...buckets.map(b=>b.value));
  const step=Math.max(26, Math.min(48, 640/buckets.length));
  const W=Math.max(buckets.length*step, 280);
  const bw=Math.min(20, step-9);
  const g=buckets.map((b,i)=>{
    const h=b.value>0?Math.max((b.value/max)*(H-40),4):2;
    const x=i*step+(step-bw)/2, y=H-24-h;
    return `<g>
      <rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="${Math.min(bw/2,6)}" fill="${b.value>0?'url(#bg1)':'var(--line)'}"><title>${b.full}: ${fmtMoney(b.value)}</title></rect>
      ${buckets.length<=16||i%Math.ceil(buckets.length/12)===0?`<text x="${x+bw/2}" y="${H-7}" text-anchor="middle" fill="var(--ink-3)" style="font-size:9.5px;font-weight:600">${b.label}</text>`:''}
    </g>`;
  }).join('');
  return `<div class="scroll-x"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="min-width:100%">
    <defs><linearGradient id="bg1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#6d3df5"/><stop offset="55%" stop-color="#9b5cff"/><stop offset="100%" stop-color="#ff4d6d"/>
    </linearGradient></defs>${g}</svg></div>`;
}

      <div class="item">
        <div class="item-l">
          <span class="avatar" style="background:linear-gradient(140deg,#00c2a833,#2e9bff1a);border:1px solid #00c2a840;color:#00a58f">${I.trend.replace('<svg','<svg width="17" height="17"')}</span>
          <div style="min-width:0">
            <p class="item-name">${esc(i.source)}</p>
            <p class="item-meta">${fmtDate(i.date)}${i.note?' · '+esc(i.note):''}</p>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
          <span class="item-amt tnum" style="color:#00a58f">+${fmtMoney(i.amount)}</span>
          <div class="acts">
            <button class="mini-btn" data-edit-income="${i.id}">${I.edit}</button>
            <button class="mini-btn danger" data-del-income="${i.id}">${I.trash}</button>
          </div>
        </div>
      </div>`).join('')}</div>`:empty('No income yet','Pocket money, salary, scholarship — log it here.')}</div>
  </div>`;
}

function viewBudgets(){
  return `<div class="rise" style="display:flex;flex-direction:column;gap:14px">
    <div class="row-between">
      <div><h1 class="h-title">Budgets</h1><p class="h-sub">Set a ceiling, watch the gauge.</p></div>
      <button class="btn btn-grad" data-open-modal="add-budget">${I.plus}Add Budget</button>
    </div>
    ${state.budgets.length
      ? `<div style="display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr))">${state.budgets.map(budgetCard).join('')}</div>`
      : `<div class="card">${empty('No budgets yet','Create a weekly or monthly limit to stay on track.')}</div>`}
  </div>`;
}

function budgetCard(b){
  const p=budgetProgress(b);
  const fill = p.status==='over' ? 'linear-gradient(90deg,#ff4d6d,#f43f5e)'
             : p.status==='warn' ? 'linear-gradient(90deg,#ff9f1c,#ffd93d)'
             : 'linear-gradient(90deg,#6d3df5,#c56cff,#2e9bff)';
  const tone = p.status==='over'?'#e11d48':p.status==='warn'?'#d97706':'var(--ink-3)';
  return `<div class="bcard">
    <span style="display:block;height:5px;background:${fill}"></span>
    <div class="pad">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
        <div style="min-width:0">
          <p style="font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(b.label)}</p>
          <p style="font-size:11.5px;color:var(--ink-3);margin-top:3px;text-transform:capitalize">${b.period} · ${b.category==='all'?'All categories':b.category}</p>
        </div>
        <div style="display:flex;gap:2px;flex-shrink:0">
          <button class="mini-btn" data-edit-budget="${b.id}">${I.edit}</button>
          <button class="mini-btn danger" data-del-budget="${b.id}">${I.trash}</button>
        </div>
      </div>
      <div style="margin-top:18px">
        <div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:9px">
          <span class="tnum" style="font-family:'Bricolage Grotesque',sans-serif;font-size:24px;font-weight:800;letter-spacing:-.035em">${fmtMoney(p.spent)}</span>
          <span class="tnum" style="font-size:12px;color:var(--ink-3);font-weight:600">of ${fmtMoney(b.amount)}</span>
        </div>
        <div class="track"><div style="width:${Math.min(100,p.pct)}%;background:${fill}"></div></div>
        <p style="margin-top:10px;font-size:12px;font-weight:600;color:${tone}">
          ${p.status==='over'?`Over by ${fmtMoney(p.spent-b.amount)}`:p.status==='warn'?`${p.pct.toFixed(0)}% used — easy now`:`${fmtMoney(Math.max(0,b.amount-p.spent))} still yours`}
        </p>
      </div>
    </div>
  </div>`;
}

function viewSettings(){
  return `<div class="rise" style="display:flex;flex-direction:column;gap:14px;max-width:620px">
    <div><h1 class="h-title">Settings</h1><p class="h-sub">Preferences for your tracker.</p></div>
    <div class="card pad">
      <div class="row-between">
        <div><p style="font-weight:650;font-size:14.5px">Appearance</p><p style="font-size:12.5px;color:var(--ink-3);margin-top:3px">Switch between light and dark.</p></div>
        <button id="theme-toggle-settings" class="btn btn-soft">${ic(state.theme==='dark'?'moon':'sun',16)}${state.theme==='dark'?'Dark':'Light'}</button>
      </div>
    </div>
    <div class="card pad">
      <p style="font-weight:650;font-size:14.5px">Your data</p>
      <p style="font-size:12.5px;color:var(--ink-3);margin:6px 0 14px">${state.expenses.length} expenses · ${state.income.length} income entries · ${state.budgets.length} budgets. Stored only in this browser.</p>
      <button id="clear-data" class="btn btn-soft" style="color:#e11d48">${I.trash}Clear all data</button>
    </div>
  </div>`;
}

/* ============================= MODAL ============================= */
function sheet(title,body,footer){
  return `<div class="backdrop" id="backdrop"><div class="sheet">
    <div class="grab"></div>
    <div class="sheet-hd"><h3>${title}</h3><button class="icon-btn" id="modal-close" style="width:34px;height:34px">${I.close}</button></div>
    <div class="sheet-bd">${body}</div>
    <div class="sheet-ft">${footer}</div>
  </div></div>`;
}
function inp(id,v,ph='',type='text'){
  return `<input id="${id}" class="field" type="${type}" value="${v==null?'':esc(String(v))}" placeholder="${ph}"${type==='number'?' inputmode="decimal" step="0.01"':''}/>`;
}
const lbl=t=>`<label class="f-lbl">${t}</label>`;
const two=(a,b)=>`<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">${a}${b}</div>`;

function renderModal(){
  const m=state.modal; if(!m) return '';
  const cancel=`<button class="btn btn-soft" id="modal-cancel">Cancel</button>`;
  if(m.type.endsWith('expense')&&m.type!=='confirm-delete'){
    const e=m.payload||{amount:'',description:'',category:CATEGORIES[0],date:todayISO(),notes:''};
    return sheet(m.type==='edit-expense'?'Edit Expense':'Add Expense',
      `<div>${lbl('Amount (₹)')}${inp('f-amount',e.amount,'0.00','number')}</div>
       <div>${lbl('Description')}${inp('f-desc',e.description,'e.g. Canteen lunch')}</div>
       ${two(`<div>${lbl('Category')}${sel('f-category',CATEGORIES.map(c=>({value:c,label:c})),e.category)}</div>`,
             `<div>${lbl('Date')}${inp('f-date',e.date,'','date')}</div>`)}
       <div>${lbl('Notes (optional)')}${inp('f-notes',e.notes,'Add a note…')}</div>
       <p class="err" id="f-err"></p>`,
      `${cancel}<button class="btn btn-grad" id="f-save">${m.type==='edit-expense'?'Save':'Add Expense'}</button>`);
  }
  if(m.type.endsWith('income')){
    const i=m.payload||{amount:'',source:INCOME_SOURCES[0],date:todayISO(),note:''};
    return sheet(m.type==='edit-income'?'Edit Income':'Add Income',
      `<div>${lbl('Amount (₹)')}${inp('f-amount',i.amount,'0.00','number')}</div>
       ${two(`<div>${lbl('Source')}${sel('f-source',INCOME_SOURCES.map(s=>({value:s,label:s})),i.source)}</div>`,
             `<div>${lbl('Date')}${inp('f-date',i.date,'','date')}</div>`)}
       <div>${lbl('Note (optional)')}${inp('f-note',i.note,'Add a note…')}</div>
       <p class="err" id="f-err"></p>`,
      `${cancel}<button class="btn btn-grad" id="f-save">${m.type==='edit-income'?'Save':'Add Income'}</button>`);
  }
  if(m.type.endsWith('budget')){
    const b=m.payload||{label:'',amount:'',period:'monthly',category:'all'};
    return sheet(m.type==='edit-budget'?'Edit Budget':'Add Budget',
      `<div>${lbl('Label')}${inp('f-label',b.label,'e.g. Monthly limit')}</div>
       <div>${lbl('Amount (₹)')}${inp('f-amount',b.amount,'0.00','number')}</div>
       ${two(`<div>${lbl('Period')}${sel('f-period',[{value:'weekly',label:'Weekly'},{value:'monthly',label:'Monthly'}],b.period)}</div>`,
             `<div>${lbl('Category')}${sel('f-category',[{value:'all',label:'All categories'},...CATEGORIES.map(c=>({value:c,label:c}))],b.category)}</div>`)}
       <p class="err" id="f-err"></p>`,
      `${cancel}<button class="btn btn-grad" id="f-save">${m.type==='edit-budget'?'Save':'Add Budget'}</button>`);
  }
  if(m.type==='confirm-delete'){
    return sheet('Delete this?',
      `<p style="font-size:14px;color:var(--ink-2);line-height:1.55">This can't be undone. Delete <b>${esc(m.payload.label)}</b>?</p>`,
      `${cancel}<button class="btn btn-red" id="confirm-del">Delete</button>`);
  }
  return '';
}

/* ============================= SHELL ============================= */
const NAV=[['dashboard','Dashboard','grid'],['expenses','Expenses','list'],['income','Income','trend'],['budgets','Budgets','target'],['settings','Settings','gear']];

function render(){
  document.documentElement.classList.toggle('dark',state.theme==='dark');
  let v='';
  if(state.view==='dashboard') v=viewDashboard();
  else if(state.view==='expenses') v=viewExpenses();
  else if(state.view==='income') v=viewIncome();
  else if(state.view==='budgets') v=viewBudgets();
  else v=viewSettings();

  document.getElementById('app').innerHTML=`
    <aside class="side">
      <div class="brand"><span class="brand-mark">${I.logo}</span><span class="brand-name">Wallet</span></div>
      <nav style="flex:1;display:flex;flex-direction:column;gap:4px">
        ${NAV.map(([id,label,icn])=>`<button class="nav-btn${state.view===id?' on':''}" data-nav="${id}">${I[icn]}<span>${label}</span></button>`).join('')}
      </nav>
      <button class="nav-btn" id="theme-toggle">${I[state.theme==='dark'?'sun':'moon']}<span>${state.theme==='dark'?'Light mode':'Dark mode'}</span></button>
    </aside>

    <div class="main">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:10px">
          <span class="brand-mark" style="width:33px;height:33px;border-radius:11px">${I.logo}</span>
          <span class="brand-name" style="font-size:17px">Wallet</span>
        </div>
        <button class="icon-btn" id="theme-toggle-mobile">${I[state.theme==='dark'?'sun':'moon']}</button>
      </header>

      <main class="content">${v}</main>

      <nav class="tabbar">
        ${NAV.map(([id,label,icn])=>`<button class="tab${state.view===id?' on':''}" data-nav="${id}"><span class="tab-ico">${I[icn]}</span><span>${label}</span></button>`).join('')}
      </nav>
    </div>

    ${renderModal()}
    ${state.toast?`<div class="toast">${I.check}${state.toast}</div>`:''}
  `;
  bind();
}

/* ============================= EVENTS ============================= */
function toast(msg){
  state.toast=msg; render();
  clearTimeout(window.__t); window.__t=setTimeout(()=>{ state.toast=null; render(); },2100);
}
const closeModal=()=>{ state.modal=null; render(); };
const openModal=(t,p=null)=>{ state.modal={type:t,payload:p}; render(); };
function num(id){ const v=parseFloat(document.getElementById(id).value); return isNaN(v)||v<=0?null:v; }
function fail(msg){ const e=document.getElementById('f-err'); e.textContent=msg; e.style.display='block'; }

function saveExpense(){
  const amount=num('f-amount'), desc=document.getElementById('f-desc').value.trim(), date=document.getElementById('f-date').value;
  if(!amount||!desc||!date) return fail('Enter a valid amount, description and date.');
  const category=document.getElementById('f-category').value, notes=document.getElementById('f-notes').value.trim();
  const m=state.modal;
  if(m.type==='edit-expense'){
    const i=state.expenses.findIndex(e=>e.id===m.payload.id);
    state.expenses[i]={...m.payload,amount,description:desc,category,date,notes}; persist(); closeModal(); toast('Expense updated');
  } else { state.expenses.push({id:uid(),amount,description:desc,category,date,notes}); persist(); closeModal(); toast('Expense added'); }
}
function saveIncome(){
  const amount=num('f-amount'), date=document.getElementById('f-date').value;
  if(!amount||!date) return fail('Enter a valid amount and date.');
  const source=document.getElementById('f-source').value, note=document.getElementById('f-note').value.trim();
  const m=state.modal;
  if(m.type==='edit-income'){
    const i=state.income.findIndex(x=>x.id===m.payload.id);
    state.income[i]={...m.payload,amount,source,date,note}; persist(); closeModal(); toast('Income updated');
  } else { state.income.push({id:uid(),amount,source,date,note}); persist(); closeModal(); toast('Income added'); }
}
function saveBudget(){
  const amount=num('f-amount'), label=document.getElementById('f-label').value.trim();
  if(!amount||!label) return fail('Enter a valid label and amount.');
  const period=document.getElementById('f-period').value, category=document.getElementById('f-category').value;
  const m=state.modal;
  if(m.type==='edit-budget'){
    const i=state.budgets.findIndex(b=>b.id===m.payload.id);
    state.budgets[i]={...m.payload,amount,label,period,category}; persist(); closeModal(); toast('Budget updated');
  } else { state.budgets.push({id:uid(),amount,label,period,category}); persist(); closeModal(); toast('Budget created'); }
}

function bind(){
  const app=document.getElementById('app');
  app.querySelectorAll('[data-nav]').forEach(el=>el.onclick=()=>{ state.view=el.dataset.nav; state.modal=null; render(); window.scrollTo(0,0); });

  ['theme-toggle','theme-toggle-mobile','theme-toggle-settings'].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.onclick=()=>{ state.theme=state.theme==='dark'?'light':'dark'; persist(); render(); };
  });

  const cd=document.getElementById('clear-data');
  if(cd) cd.onclick=()=>openModal('confirm-delete',{label:'all your data',onConfirm:'clear-all'});

  const dp=document.getElementById('dash-period');
  if(dp) dp.onchange=e=>{ state.dashPeriod=e.target.value; render(); };

  const hs=document.getElementById('hist-search');
  if(hs){
    hs.oninput=e=>{ state.histFilters.search=e.target.value; repaintExpenses(); };
    if(document.activeElement!==hs && state.histFilters.search){ hs.focus(); hs.setSelectionRange(hs.value.length,hs.value.length); }
  }
  const map={'hist-category':'category','hist-period':'period','hist-start':'start','hist-end':'end'};
  Object.entries(map).forEach(([id,k])=>{ const el=document.getElementById(id); if(el) el.onchange=e=>{ state.histFilters[k]=e.target.value; render(); }; });

  app.querySelectorAll('[data-open-modal]').forEach(el=>el.onclick=()=>openModal(el.dataset.openModal));
  app.querySelectorAll('[data-edit-expense]').forEach(el=>el.onclick=()=>openModal('edit-expense',state.expenses.find(e=>e.id===el.dataset.editExpense)));
  app.querySelectorAll('[data-edit-income]').forEach(el=>el.onclick=()=>openModal('edit-income',state.income.find(i=>i.id===el.dataset.editIncome)));
  app.querySelectorAll('[data-edit-budget]').forEach(el=>el.onclick=()=>openModal('edit-budget',state.budgets.find(b=>b.id===el.dataset.editBudget)));
  app.querySelectorAll('[data-del-expense]').forEach(el=>el.onclick=()=>{ const i=state.expenses.find(e=>e.id===el.dataset.delExpense); openModal('confirm-delete',{label:i.description,kind:'expense',id:i.id}); });
  app.querySelectorAll('[data-del-income]').forEach(el=>el.onclick=()=>{ const i=state.income.find(x=>x.id===el.dataset.delIncome); openModal('confirm-delete',{label:i.source,kind:'income',id:i.id}); });
  app.querySelectorAll('[data-del-budget]').forEach(el=>el.onclick=()=>{ const b=state.budgets.find(x=>x.id===el.dataset.delBudget); openModal('confirm-delete',{label:b.label,kind:'budget',id:b.id}); });

  const bd=document.getElementById('backdrop');
  if(bd){
    bd.onclick=e=>{ if(e.target===bd) closeModal(); };
    const c1=document.getElementById('modal-close'); if(c1) c1.onclick=closeModal;
    const c2=document.getElementById('modal-cancel'); if(c2) c2.onclick=closeModal;
    const sv=document.getElementById('f-save');
    if(sv) sv.onclick=()=>{ const t=state.modal.type;
      if(t.includes('expense')) saveExpense(); else if(t.includes('income')) saveIncome(); else saveBudget(); };
    const dl=document.getElementById('confirm-del');
    if(dl) dl.onclick=()=>{
      const p=state.modal.payload;
      let msg='Deleted';
      if(p.kind==='expense'){ state.expenses=state.expenses.filter(e=>e.id!==p.id); msg='Expense deleted'; }
      else if(p.kind==='income'){ state.income=state.income.filter(i=>i.id!==p.id); msg='Income deleted'; }
      else if(p.kind==='budget'){ state.budgets=state.budgets.filter(b=>b.id!==p.id); msg='Budget deleted'; }
      else if(p.onConfirm==='clear-all'){ state.expenses=[]; state.income=[]; state.budgets=[]; msg='All data cleared'; }
      persist(); closeModal(); toast(msg);
    };
    const first=bd.querySelector('.field'); if(first && window.innerWidth>640) first.focus();
  }
}

function repaintExpenses(){
  document.querySelector('.content').innerHTML=viewExpenses();
  bind();
  const hs=document.getElementById('hist-search');
  if(hs){ hs.focus(); hs.setSelectionRange(hs.value.length,hs.value.length); }
}

document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&state.modal) closeModal(); });
render();
</script>
</body>
</html>
